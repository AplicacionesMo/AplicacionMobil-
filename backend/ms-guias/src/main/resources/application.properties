spring.application.name=ms-guias
server.port=8083

# ---------- MySQL (XAMPP / Laragon / MySQL Workbench) ----------
# La base se crea sola la primera vez (createDatabaseIfNotExist=true)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/tactical_guias?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}

# Hibernate crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Documentacion interactiva de los endpoints
springdoc.swagger-ui.path=/swagger-ui.html

