# Perfil de respaldo: ejecutar con  --spring.profiles.active=h2
# Guarda los datos en un archivo local, sin necesidad de MySQL.
spring.datasource.url=jdbc:h2:file:./data/tactical_usuarios;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
