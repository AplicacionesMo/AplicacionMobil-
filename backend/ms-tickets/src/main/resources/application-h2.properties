# Perfil de respaldo: ejecutar con  --spring.profiles.active=h2
# Guarda los datos en un archivo local, sin necesidad de MySQL.
spring.datasource.url=jdbc:h2:file:./data/tactical_tickets;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true

# En local el ms-guias tambien corre en este PC
servicios.guias.url=${GUIAS_URL:http://127.0.0.1:8083}
