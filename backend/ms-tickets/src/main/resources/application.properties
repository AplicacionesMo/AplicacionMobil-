spring.application.name=ms-tickets
server.port=8082

# ---------- MySQL (XAMPP / Laragon / MySQL Workbench) ----------
# La base se crea sola la primera vez (createDatabaseIfNotExist=true)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/tactical_tickets?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}

# Hibernate crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Documentacion interactiva de los endpoints
springdoc.swagger-ui.path=/swagger-ui.html

# URL del microservicio de guias (se consulta antes de cerrar o eliminar un ticket)
# 127.0.0.1 y no "localhost": en algunos Windows Java resuelve localhost a IPv6 (::1) y no conecta
servicios.guias.url=${GUIAS_URL:http://127.0.0.1:8083}

# Diagnostico: http://localhost:PUERTO/actuator/health
# Muestra el estado del servicio, de su base de datos (db) y, en ms-tickets, de la conexion con ms-guias
management.endpoint.health.show-details=always
